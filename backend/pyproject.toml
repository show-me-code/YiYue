[project]
name = "yiyue-backend"
version = "0.1.0"
description = "译阅 — 本地 PDF 翻译工作台后端（BabelDOC + FastAPI）"
requires-python = ">=3.12,<3.13"
dependencies = [
    # 翻译引擎：锁定版本，内部 API 经 babeldoc_runner 隔离层调用
    "babeldoc==0.6.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pypdf>=5.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
